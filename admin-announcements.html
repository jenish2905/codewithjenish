<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Announcements | Code With Jenish</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}
body{background:#050816;color:#fff;padding:24px}
:root{--cyan:#00ffff;--muted:#aab4c8}
.container{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:28px}
h1{color:var(--cyan);font-size:27px}
a{color:var(--cyan);text-decoration:none}
.panel{background:rgba(255,255,255,.04);border:1px solid rgba(0,255,255,.18);border-radius:14px;padding:22px;margin-bottom:24px}
h2{font-size:20px;margin-bottom:18px}
label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}
input,textarea,select{width:100%;padding:12px;border:1px solid #33415d;border-radius:8px;background:#080d20;color:white;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--cyan)}
textarea{min-height:130px;resize:vertical}
.field{margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.full{grid-column:1/-1}
button{border:1px solid var(--cyan);border-radius:8px;padding:10px 14px;background:transparent;color:var(--cyan);font-weight:700;cursor:pointer}
button:hover{background:var(--cyan);color:#050816}
.primary{background:var(--cyan);color:#050816}
.danger{border-color:#ff7777;color:#ff9999}
.danger:hover{background:#ff7777;color:#050816}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:18px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:13px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
th{color:var(--cyan)}
td{color:#dce4f4}
.status{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px}
.published{color:#64e6ad;background:rgba(0,220,140,.12)}
.draft{color:#ffd477;background:rgba(255,190,60,.12)}
.empty{padding:25px;text-align:center;color:var(--muted)}
@media(max-width:650px){body{padding:14px}.grid,.toolbar{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📢 Manage Announcements</h1>
    <a href="admin-dashboard.html">← Admin Dashboard</a>
  </header>

  <section class="panel">
    <h2 id="formTitle">Create Announcement</h2>
    <form id="announcementForm">
      <input type="hidden" id="editId">
      <div class="grid">
        <div class="field full">
          <label for="title">Announcement Title *</label>
          <input id="title" maxlength="120" required placeholder="e.g. New JavaScript course available">
        </div>

        <div class="field full">
          <label for="message">Message *</label>
          <textarea id="message" maxlength="2000" required placeholder="Write your announcement..."></textarea>
        </div>

        <div class="field">
          <label for="audience">Audience</label>
          <select id="audience">
            <option value="all">All students</option>
            <option value="email">Specific student by email</option>
          </select>
        </div>

        <div class="field" id="emailField" style="display:none">
          <label for="targetEmail">Student Email</label>
          <input id="targetEmail" type="email" placeholder="student@example.com">
        </div>

        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="draft">Draft</option>
            <option value="published">Publish now</option>
          </select>
        </div>

        <div class="field full actions">
          <button class="primary" type="submit" id="saveBtn">Save Announcement</button>
          <button type="button" id="cancelBtn" style="display:none">Cancel Edit</button>
        </div>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>All Announcements</h2>
    <div class="toolbar">
      <input id="search" placeholder="Search announcements...">
      <select id="statusFilter">
        <option value="all">All statuses</option>
        <option value="published">Published</option>
        <option value="draft">Draft</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Audience</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="announcementTable"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" style="display:none">No announcements found.</div>
  </section>
</div>

<script>
if(localStorage.getItem("adminLoggedIn")!=="true"){
  window.location.href="admin-login.html";
}

const KEY="announcements";
const form=document.getElementById("announcementForm");
const audience=document.getElementById("audience");
const emailField=document.getElementById("emailField");

function loadItems(){
  try{
    const value=JSON.parse(localStorage.getItem(KEY));
    return Array.isArray(value)?value:[];
  }catch{return [];}
}
let items=loadItems();

function saveItems(){
  localStorage.setItem(KEY,JSON.stringify(items));
}

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function resetForm(){
  form.reset();
  document.getElementById("editId").value="";
  document.getElementById("formTitle").textContent="Create Announcement";
  document.getElementById("saveBtn").textContent="Save Announcement";
  document.getElementById("cancelBtn").style.display="none";
  emailField.style.display="none";
}

audience.addEventListener("change",()=>{
  emailField.style.display=audience.value==="email"?"block":"none";
});

form.addEventListener("submit",event=>{
  event.preventDefault();

  const id=document.getElementById("editId").value;
  const title=document.getElementById("title").value.trim();
  const message=document.getElementById("message").value.trim();
  const targetAudience=audience.value;
  const targetEmail=document.getElementById("targetEmail").value.trim().toLowerCase();
  const status=document.getElementById("status").value;

  if(!title||!message){
    alert("Please enter a title and message.");
    return;
  }

  if(targetAudience==="email"&&!targetEmail){
    alert("Enter the student's email address.");
    return;
  }

  const existing=items.find(item=>String(item.id)===id);

  if(id&&!existing){
    alert("Announcement not found.");
    return;
  }

  const record={
    id:id||("ann-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)),
    title,
    message,
    audience:targetAudience,
    targetEmail:targetAudience==="email"?targetEmail:"",
    status,
    createdAt:existing?.createdAt||new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };

  if(existing){
    items=items.map(item=>String(item.id)===id?record:item);
  }else{
    items.push(record);
  }

  saveItems();
  resetForm();
  render();
  alert("Announcement saved.");
});

function editItem(id){
  const item=items.find(entry=>String(entry.id)===String(id));
  if(!item)return;

  document.getElementById("editId").value=item.id;
  document.getElementById("title").value=item.title;
  document.getElementById("message").value=item.message;
  audience.value=item.audience||"all";
  document.getElementById("targetEmail").value=item.targetEmail||"";
  document.getElementById("status").value=item.status||"draft";
  emailField.style.display=audience.value==="email"?"block":"none";

  document.getElementById("formTitle").textContent="Edit Announcement";
  document.getElementById("saveBtn").textContent="Update Announcement";
  document.getElementById("cancelBtn").style.display="inline-block";
  window.scrollTo({top:0,behavior:"smooth"});
}

function toggleStatus(id){
  items=items.map(item=>{
    if(String(item.id)!==String(id))return item;
    return {
      ...item,
      status:item.status==="published"?"draft":"published",
      updatedAt:new Date().toISOString()
    };
  });
  saveItems();
  render();
}

function deleteItem(id){
  const item=items.find(entry=>String(entry.id)===String(id));
  if(!item||!confirm(`Delete "${item.title}"?`))return;
  items=items.filter(entry=>String(entry.id)!==String(id));
  saveItems();
  render();
}

function render(){
  const query=document.getElementById("search").value.trim().toLowerCase();
  const filter=document.getElementById("statusFilter").value;

  const filtered=items.filter(item=>
    (String(item.title).toLowerCase().includes(query)||
     String(item.message).toLowerCase().includes(query))&&
    (filter==="all"||item.status===filter)
  ).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));

  document.getElementById("empty").style.display=filtered.length?"none":"block";

  document.getElementById("announcementTable").innerHTML=filtered.map(item=>`
    <tr>
      <td>${escapeHTML(item.title)}</td>
      <td>${item.audience==="email"?"Specific student":"All students"}</td>
      <td><span class="status ${item.status==="published"?"published":"draft"}">
        ${item.status==="published"?"Published":"Draft"}
      </span></td>
      <td>${escapeHTML(new Date(item.createdAt).toLocaleDateString())}</td>
      <td>
        <div class="actions">
          <button data-action="edit" data-id="${escapeHTML(item.id)}">Edit</button>
          <button data-action="toggle" data-id="${escapeHTML(item.id)}">
            ${item.status==="published"?"Unpublish":"Publish"}
          </button>
          <button class="danger" data-action="delete" data-id="${escapeHTML(item.id)}">Delete</button>
        </div>
      </td>
    </tr>
  `).join("");
}

document.getElementById("announcementTable").addEventListener("click",event=>{
  const button=event.target.closest("button[data-action]");
  if(!button)return;
  const {action,id}=button.dataset;
  if(action==="edit")editItem(id);
  if(action==="toggle")toggleStatus(id);
  if(action==="delete")deleteItem(id);
});

document.getElementById("cancelBtn").addEventListener("click",resetForm);
document.getElementById("search").addEventListener("input",render);
document.getElementById("statusFilter").addEventListener("change",render);

window.addEventListener("storage",event=>{
  if(event.key===KEY){
    items=loadItems();
    render();
  }
});

render();
</script>
</body>
</html>
