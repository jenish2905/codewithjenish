<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Code With Jenish</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family: "Inter", sans-serif;

            background: #050816;
            color: white;
        }

        .login-box {
            width: 100%;
            max-width: 430px;

            padding: 45px;

            background: rgba(255,255,255,0.05);

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 22px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.4);
        }

        .admin-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #7c3aed
                );

            color: #020617;

            font-size: 28px;

            font-weight: 800;
        }

        .logo {
            text-align: center;

            font-size: 23px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        .logo span {
            color: #00e5ff;
        }

        .subtitle {
            text-align: center;

            color: #9ca3af;

            font-size: 13px;

            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid
                rgba(255,255,255,0.12);

            background:
                rgba(255,255,255,0.05);

            color: white;

            outline: none;

            font-size: 14px;
        }

        input:focus {
            border-color: #00e5ff;

            box-shadow:
                0 0 0 3px
                rgba(0,229,255,0.08);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 45px;
        }

        .eye {
            position: absolute;

            right: 14px;

            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            color: #9ca3af;
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #3b82f6
                );

            color: #001018;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;
        }

        .message {
            display: none;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 13px;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #6b7280;

            font-size: 13px;
        }

        .back:hover {
            color: #00e5ff;
        }

        .security {
            text-align: center;

            margin-top: 25px;

            color: #6b7280;

            font-size: 11px;
        }

        @media(max-width:500px) {

            .login-box {
                padding: 30px 22px;
            }

        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="admin-icon">
        &lt;/&gt;
    </div>


    <div class="logo">

        Code <span>With Jenish</span>

    </div>


    <p class="subtitle">

        Administrator Portal

    </p>


    <div id="message" class="message"></div>


    <form id="adminLoginForm">


        <div class="form-group">

            <label>
                Admin Email
            </label>

            <input
                type="email"
                id="adminEmail"
                placeholder="admin@example.com"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Admin Password
            </label>


            <div class="password-box">

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter admin password"
                    required
                >

                <span
                    class="eye"
                    onclick="togglePassword()">

                    👁

                </span>

            </div>

        </div>


        <button
            type="submit"
            class="login-btn">

            Login to Admin Panel

        </button>


    </form>


    <a
        href="index.html"
        class="back">

        ← Back to Website

    </a>


    <div class="security">

        🔒 Authorized administrators only

    </div>


</div>


<script>


/*
    DEMO ADMIN CREDENTIALS

    Email:
    admin@codewithjenish.com

    Password:
    Admin@123
*/


const ADMIN_EMAIL =
    "admin@codewithjenish.com";


const ADMIN_PASSWORD =
    "Admin@123";


const form =
    document.getElementById(
        "adminLoginForm"
    );


form.addEventListener(
    "submit",
    function(e) {

        e.preventDefault();


        const email =
            document
            .getElementById(
                "adminEmail"
            )
            .value
            .trim()
            .toLowerCase();


        const password =
            document
            .getElementById(
                "adminPassword"
            )
            .value;


        if (
            email === ADMIN_EMAIL &&
            password === ADMIN_PASSWORD
        ) {


            localStorage.setItem(
                "adminLoggedIn",
                "true"
            );


            showMessage(
                "Login successful. Opening admin panel...",
                "success"
            );


            setTimeout(
                () => {

                    window.location.href =
                        "admin-dashboard.html";

                },
                800
            );


        } else {


            showMessage(
                "Invalid admin email or password.",
                "error"
            );

        }

    }
);


function showMessage(text, type) {

    const message =
        document.getElementById(
            "message"
        );


    message.style.display =
        "block";


    message.textContent =
        text;


    if(type === "success") {

        message.style.background =
            "rgba(34,197,94,0.12)";

        message.style.color =
            "#4ade80";

    } else {

        message.style.background =
            "rgba(239,68,68,0.12)";

        message.style.color =
            "#f87171";

    }

}


function togglePassword() {

    const input =
        document.getElementById(
            "adminPassword"
        );


    input.type =
        input.type === "password"
        ? "text"
        : "password";

}

</script>


</body>

</html>
